- claim_id: CANON-CHAR-020
  text: >
    Cassandra is a clairvoyant temporal mage. She escapes through the portal with
    Dae at the end of Book 1. Between Books 1 and 2 (TA 1999-2053), she becomes
    the resistance's most critical strategist, using her clairvoyance to stay ahead
    of ADMIN raids and protect hidden mage communities. Temporal magic takes a toll
    on her — by TA 2053 she experiences multiple timelines simultaneously and is
    quietly unraveling. She calls Dae "the fixed point" because his technomancy
    exists outside the natural order, making him unpredictable to her sight.
    In Book 2, during the final assault on ADMIN, she sacrifices herself by locking
    R inside a temporal loop with herself, trapping R in an eternal instant. The
    loop holds long enough for Valnarey to destroy R's physical anchor. Cassandra
    dies from the strain. Her last words are: "I saw every version of this. This
    was the only one where you both live."
  category: characters
  source: "Human decision 2026-03-23"
  date_canonized: "2026-03-23"
  related_claims: []
  notes: "Third Age. Clairvoyant temporal mage. Resistance strategist between Books 1-2. Sacrifices herself in Book 2 to trap R. Arc approved in decisions-2026-03-23-inil-rename-cassandra.md."

