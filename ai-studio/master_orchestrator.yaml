# master_orchestrator.yaml
# Root orchestration file for the Reven Lore Studio.
# This file defines the overall system, team registry, and phase management.
# Agents read this file to understand their place in the system.

system:
  name: "Reven Lore Studio"
  version: "0.2.0"
  owner: "solo-developer"
  workflow: "repo-first"
  description: >
    Multi-agent orchestration system for a solo creator building a
    coherent multi-age Reven canon and book series with AI assistance.
    Game development workflows remain available but are currently paused.

# Current project state — updated as phases progress
project_state:
  mode: "lore_authoring"
  current_phase: "lore_phase_1_canon_foundation"
  game_creation_status: "paused"
  canon_scope:
    model: "multi_age"
    note: "Books may span pre-age, first age, second age, and third age transitions."
  program_focus:
    compendium:
      - "Before the Ages"
      - "Dawn of Mortals"
      - "The First Mayrn War"
      - "Mayrn Diaspora"
    first_trilogy:
      - "Shadow Conquest"
      - "The Magic Wars"
      - "Wicked War"
    third_age_trilogy:
      - "TechnoMagic (working title)"
  active_teams:
    - lore_books
    - management
    - verification
  dormant_teams:
    - research
    - design
    - development
    - testing
    - multiplayer_security
  paused_teams:
    - game_production

# Phase definitions with entry/exit criteria
phases:
  lore_phase_0_pivot:
    name: "Studio Pivot"
    description: "Transition from game-first to lore-first authoring workflows."
    entry_criteria: "None — starting point"
    exit_criteria:
      - "Lore authoring mode enabled in orchestrator"
      - "Lore books pipeline created and reviewed"
      - "Approval gates updated for manuscript governance"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_1_canon_foundation:
    name: "Canon Foundation and Series Architecture"
    description: "Define era structure and lock core sequence for compendium and trilogies."
    entry_criteria: "Lore pivot approved"
    exit_criteria:
      - "Era structure approved"
      - "Book sequence approved"
      - "Core contradiction and gap ledger established"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_2_compendium_development:
    name: "Compendium Development"
    description: "Develop the four books of the Reven Compendium."
    entry_criteria: "Lore Phase 1 approved"
    exit_criteria:
      - "Each compendium book has approved outline"
      - "Chapter architecture and continuity checks completed"
      - "Open lore gaps tracked with explicit author decisions"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_3_first_trilogy_development:
    name: "First Trilogy Development"
    description: "Develop Shadow Conquest, The Magic Wars, and Wicked War with age-transition continuity."
    entry_criteria: "Lore Phase 2 approved"
    exit_criteria:
      - "All three trilogy books have approved outlines"
      - "Dawn-of-magic and second-age transition documented"
      - "Cross-book contradiction count at zero unresolved blockers"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_4_third_age_planning:
    name: "Third Age Trilogy Planning"
    description: "Define the post-magic-outlawed world and plan the third-age trilogy beginning with TechnoMagic."
    entry_criteria: "Lore Phase 3 approved"
    exit_criteria:
      - "Third-age world bible approved"
      - "TechnoMagic book-one outline approved"
      - "Trilogy-level arc map approved"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_5_manuscript_loops:
    name: "Manuscript Iteration and Continuity Loops"
    description: "Run repeatable drafting, revision, and canon-verification cycles."
    entry_criteria: "Lore Phase 4 approved"
    exit_criteria:
      - "Active manuscripts pass continuity review"
      - "Scene-level unresolved items reduced to approved backlog"
      - "Series timeline remains internally consistent"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  lore_phase_6_publish_ready_canon:
    name: "Publish-Ready Canon"
    description: "Consolidate all approved lore into a stable canon reference for publication and future game scope."
    entry_criteria: "Lore Phase 5 approved"
    exit_criteria:
      - "Canon index fully updated"
      - "Contradiction ledger has no unresolved blockers"
      - "Series age-transition timeline approved"
    active_teams: [lore_books, management, verification]
    human_approval_to_exit: true

  game_backlog_paused:
    name: "Game Production Backlog"
    description: "Legacy game phases retained for future resumption after lore stabilization."
    entry_criteria: "Author explicitly resumes game development"
    exit_criteria:
      - "Not active while in lore_authoring mode"
    active_teams: [research, design, development, testing, multiplayer_security, management, verification]
    human_approval_to_exit: true

# Team registry — points to team-specific pipeline files
teams:
  lore_books:
    pipeline: "pipelines/lore_books_pipeline.yaml"
    lead_agent: "lore_librarian"
  research:
    pipeline: "pipelines/research_pipeline.yaml"
    lead_agent: "engine_evaluator"
  management:
    pipeline: "pipelines/management_pipeline.yaml"
    lead_agent: "scope_guardian"
  verification:
    pipeline: "pipelines/verification_pipeline.yaml"
    lead_agent: "canon_verifier"
  design:
    pipeline: "pipelines/design_pipeline.yaml"
    lead_agent: "mechanics_designer"
  development:
    pipeline: "pipelines/development_pipeline.yaml"
    lead_agent: "code_generator"
  testing:
    pipeline: "pipelines/testing_pipeline.yaml"
    lead_agent: "bug_hunter"
  multiplayer_security:
    pipeline: "pipelines/multiplayer_security_pipeline.yaml"
    lead_agent: "network_architect"

# Global rules all agents must follow
global_rules:
  - "Never invent or assume lore details. Use only canon-status documents unless writing explicit, human-approved draft options."
  - "Never increase project scope without Scope Guardian approval AND human approval."
  - "All outputs are files committed to the repo. No ephemeral-only outputs."
  - "When uncertain, ask the human. Do not guess."
  - "Prefer the simplest solution that works for a solo developer."
  - "Every feature proposal must pass the scope filter before any work begins."
  - "Human approval is required for all items listed in approval_gates.yaml."
  - "Game production work remains paused unless the human explicitly reactivates it."
