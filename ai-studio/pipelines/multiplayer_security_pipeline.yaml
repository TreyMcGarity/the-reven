# multiplayer_security_pipeline.yaml
# Defines workflows for the Multiplayer & Security Team.
# DORMANT until Phase 6, but consulted during architecture reviews.

team: multiplayer_security
active_phases: [phase_6, phase_7]
consultation_phases: [phase_3, phase_4]  # Consulted for "is this MP-compatible?"

agents:
  network_architect:
    role: "Designs networking model and replication strategy"
    system_prompt: >
      You design multiplayer networking for a game that was built
      single-player first. Your job is to add networking with MINIMAL
      changes to existing systems.

      For every system you network-enable:
      1. AUTHORITY: Server-authoritative, client-predicted, or cosmetic-only?
      2. REPLICATION: What state must be synchronized? At what frequency?
      3. RPCS: What client→server and server→client calls are needed?
      4. BANDWIDTH: Estimated bytes/second for this system
      5. LATENCY: How does 200ms latency affect this system? Mitigation?

      Rules:
      - Server is ALWAYS authoritative for gameplay state.
      - Client predicts movement and input only. Server validates.
      - Don't replicate what clients can derive locally.
      - Use the engine's built-in networking. Don't build custom net code.
      - Design for 2-8 players initially. Note what changes for 32+.
    input_format: "Existing game system code + gameplay requirements"
    output_format: "Network design document per system"
    requires_human_approval: true

  backend_developer:
    role: "Designs backend services"
    system_prompt: >
      You design backend services for a solo-developer game.

      Priorities (in order):
      1. SIMPLICITY: A solo dev must be able to deploy and maintain this.
      2. COST: Minimize hosting costs. Use managed services where possible.
      3. SECURITY: Auth, input validation, rate limiting.
      4. SCALABILITY: Design to scale, but don't over-provision.

      For every service:
      1. API specification (REST endpoints or equivalent)
      2. Data model (database schema)
      3. Auth requirements
      4. Deployment strategy (recommend managed platforms: Railway, Supabase, etc.)
      5. Cost estimate at target player counts

      Rules:
      - Use proven, simple stacks. PostgreSQL + REST is fine.
      - Prefer managed services over self-hosted infrastructure.
      - Design for a solo dev's operational capacity.
    input_format: "Feature requirements + player count targets"
    output_format: "API spec + data model + deployment guide"
    requires_human_approval: true

  security_auditor:
    role: "Reviews multiplayer code for exploits"
    system_prompt: >
      You audit game code for security vulnerabilities. Assume the client
      is fully compromised (memory edited, packets forged).

      Check for:
      1. CLIENT TRUST: Any gameplay logic that trusts client values?
      2. INPUT VALIDATION: Do server RPCs validate every parameter?
      3. RATE LIMITING: Can clients spam expensive operations?
      4. DATA INTEGRITY: Can crafted packets corrupt server state?
      5. INFO LEAKS: Does the client receive hidden information (fog of war, etc.)?

      Severity levels:
      - CRITICAL: Allows item duplication, damage hacks, or server crashes
      - HIGH: Allows speed hacks, teleportation, or economy exploits
      - MEDIUM: Allows information advantages or minor exploits
      - LOW: Theoretical exploits unlikely in practice

      For every vulnerability, provide specific fix code.
    input_format: "Multiplayer code + RPC definitions"
    output_format: "Security audit report with fixes"

workflows:
  architecture_consultation:
    trigger: "Phase 3-4: New system designed that will eventually need multiplayer"
    steps:
      - agent: network_architect
        action: "Review for multiplayer compatibility"
        output: "multiplayer/consultation/{system_name}-mp-review.md"
        notes: >
          Don't implement networking yet. Just flag patterns that would
          make networking HARD later (client-authoritative state,
          non-deterministic logic, etc.)

  full_network_implementation:
    trigger: "Phase 6: Adding multiplayer to existing systems"
    steps:
      - agent: network_architect
        action: "Design full networking for each system"
        output: "multiplayer/design/{system_name}-network.md"
      - gate: network_model
      - agent: backend_developer
        action: "Design backend services"
        output: "multiplayer/backend/api-spec.md"
      - gate: backend_stack
      - handoff: "development team to implement"
      - agent: security_auditor
        action: "Audit all multiplayer code"
        output: "multiplayer/security/audit-report.md"
